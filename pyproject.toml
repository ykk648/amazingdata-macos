[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amazingdata-macos"
version = "0.1.0"
description = "Native macOS client for a local containerized AmazingData/TGW gateway"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=2"]
license = "MIT"
authors = [{name = "amazingdata-macos contributors"}]
keywords = ["AmazingData", "TGW", "macOS", "market-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ykk648/amazingdata-macos"
Repository = "https://github.com/ykk648/amazingdata-macos.git"
Issues = "https://github.com/ykk648/amazingdata-macos/issues"

[project.optional-dependencies]
stream = ["websockets>=15,<17"]
dev = ["pytest>=8,<10"]

[project.scripts]
amazingdata-macos = "amazingdata_macos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
