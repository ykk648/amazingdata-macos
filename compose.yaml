services:
  gateway:
    build:
      context: .
    image: amazingdata-macos-gateway:local
    platform: linux/amd64
    # 看门狗在会话不可恢复时会主动退出（os._exit(75)）等 Docker 拉起；
    # restart: "no" 会让它一直躺着，直到下一次 ensure_available() 才被复活。
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AMAZINGDATA_LOCAL_DATA: /data
      AMAZINGDATA_STATE_DIR: /state
      # 让致命信号打印全部线程栈，便于排查「静默退出」。
      PYTHONFAULTHANDLER: "1"
    ports:
      - "127.0.0.1:${AMAZINGDATA_HTTP_PORT:-8765}:8765"
    volumes:
      - amazingdata-cache:/data
      - amazingdata-state:/state

volumes:
  amazingdata-cache:
  amazingdata-state:
